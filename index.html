<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幽刹寻宝 · 秘藏之旅</title>
<style>
  /* ========== 全局与配色（暗金 / 墨黑 / 鎏金） ========== */
  :root{
    --gold:#d4af37;
    --gold-light:#f5d76e;
    --gold-deep:#8a6d1f;
    --ink:#0a0805;
    --danger:#c0392b;
    /* 高级香槟金（用于胜利结算界面，克制、不刺眼） */
    --g1:#f6edd2;  /* 高光 */
    --g2:#dcc27e;  /* 主色 */
    --g3:#b08d4a;  /* 中间调 */
    --g4:#6f5624;  /* 暗部 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--ink);
    color:#e9e2d0;
    font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  /* ========== 场景背景层（同风格插画，带渐变兜底） ========== */
  .scene{
    position:fixed;inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1.4s ease;
    z-index:0;
    /* 轻微放大以裁掉图片边缘水印，并压低亮度营造幽森氛围 */
    transform:scale(1.12);
    filter:brightness(.72) saturate(.92) contrast(1.06);
  }
  .scene.active{opacity:1;}
  .scene::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 30%, rgba(0,0,0,.75) 100%);
  }
  /* 兜底纹理由 background-image 的渐变承担；下面给每个场景一个氛围底色 */
  .scene{background-color:#0a0805;}

  /* 场景暗角 & 微光 */
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(212,175,55,.08), transparent 55%),
               radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.6) 100%);
  }

  /* ========== 顶部 HUD（游戏状态面板） ========== */
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 24px;gap:16px;
    background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
  }
  /* 背景音乐开关 */
  .hud-right{display:flex;align-items:center;gap:10px;}
  .sound{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;font-family:inherit;font-size:15px;line-height:1;
    color:var(--gold-light);background:rgba(0,0,0,.45);
    border:1px solid rgba(212,175,55,.45);
    transition:.2s;
  }
  .sound:hover{background:rgba(212,175,55,.14);box-shadow:0 0 16px rgba(212,175,55,.25);}
  .sound.off{color:#6f6650;border-color:rgba(212,175,55,.18);opacity:.55;}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:3px;color:var(--gold-light);
    text-shadow:0 0 12px rgba(212,175,55,.6);
  }
  .brand .sigil{
    width:26px;height:26px;border:2px solid var(--gold);border-radius:50%;
    display:grid;place-items:center;color:var(--gold);font-size:13px;
    box-shadow:0 0 14px rgba(212,175,55,.5) inset,0 0 10px rgba(212,175,55,.4);
  }
  .status{
    display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:1px;
    padding:6px 14px;border:1px solid rgba(212,175,55,.45);border-radius:20px;
    background:rgba(0,0,0,.4);color:var(--gold-light);
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .status.danger{border-color:var(--danger);color:#ff9b8f;}
  .status.danger .dot{background:var(--danger);box-shadow:0 0 8px var(--danger);}
  .status.success{border-color:var(--gold-light);color:#fff6d8;}
  .status.success .dot{background:var(--gold-light);box-shadow:0 0 12px var(--gold-light);}

  /* 章节进度 */
  .progress{
    position:fixed;top:66px;left:0;right:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:14px 0 34px;
    background:linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,0));
    pointer-events:none;
  }
  .steps{display:flex;gap:10px;align-items:center;}
  .step{
    width:9px;height:9px;border-radius:50%;
    background:rgba(255,255,255,.18);
    box-shadow:0 0 0 1px rgba(0,0,0,.55);
    transition:.5s;
  }
  .step.done{background:var(--gold);box-shadow:0 0 10px var(--gold);}
  .chapter{font-size:12px;letter-spacing:2px;color:var(--gold-light);text-shadow:0 1px 8px rgba(0,0,0,.95),0 0 14px rgba(212,175,55,.4);}
  .bar{
    width:min(560px,72vw);height:3px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.12);
  }
  .bar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));
    box-shadow:0 0 12px var(--gold);
    transition:width .9s cubic-bezier(.22,1,.36,1);
  }

  /* ========== 旁白 / 游戏日志面板 ========== */
  .log{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    width:min(680px,88vw);max-height:38vh;overflow-y:auto;
    z-index:15;padding:18px 22px;
    background:linear-gradient(180deg, rgba(15,12,6,.82), rgba(8,6,3,.9));
    border:1px solid rgba(212,175,55,.35);
    border-radius:14px;
    box-shadow:0 0 40px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4) inset;
    backdrop-filter:blur(4px);
    scrollbar-width:none;
    transition:opacity .6s;
  }
  .log::-webkit-scrollbar{display:none;}
  .log .line{
    font-size:15px;line-height:1.9;letter-spacing:1px;
    margin-bottom:6px;color:#ded4bd;min-height:1.9em;
  }
  .log .line.action{color:#b8a97e;font-style:italic;}
  .log .line.result{color:#f0e6c8;}
  .log .line.success{
    color:var(--gold-light);text-shadow:0 0 10px rgba(212,175,55,.5);
  }
  .log .line.fail{color:#ff8a7a;text-shadow:0 0 10px rgba(192,57,43,.5);}
  /* 用 CSS 画的小菱形做行首标记，避免依赖字体符号（防止显示成豆腐块） */
  .log .line::before{
    content:"";display:inline-block;width:5px;height:5px;margin-right:9px;
    background:var(--gold-deep);transform:rotate(45deg) translateY(-1px);vertical-align:middle;
  }

  /* ========== 按钮 ========== */
  .btn{
    cursor:pointer;font-family:inherit;
    padding:12px 30px;font-size:15px;letter-spacing:4px;
    color:#1a1408;
    background:linear-gradient(180deg,var(--gold-light),var(--gold),var(--gold-deep));
    border:none;border-radius:6px;
    box-shadow:0 0 22px rgba(212,175,55,.55), 0 3px 0 #5c4715;
    transition:.2s;
    font-weight:700;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(245,215,110,.8), 0 5px 0 #5c4715;}
  .btn:active{transform:translateY(1px);box-shadow:0 0 18px rgba(212,175,55,.5), 0 2px 0 #5c4715;}
  .btn.ghost{
    background:transparent;color:var(--gold-light);
    border:1px solid rgba(212,175,55,.6);box-shadow:none;font-weight:400;
  }
  .btn.ghost:hover{background:rgba(212,175,55,.12);}
  .btn[hidden]{display:none;}

  /* ========== 开场封面 ========== */
  .cover{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;
    background:
      radial-gradient(circle at 50% 35%, rgba(212,175,55,.14), transparent 50%),
      linear-gradient(180deg,#100c05,#050402);
    transition:opacity 1s, visibility 1s;
  }
  .cover.hide{opacity:0;visibility:hidden;}
  .cover .seal{
    width:78px;height:78px;margin:0 auto 26px;border:2px solid var(--gold);border-radius:50%;
    display:grid;place-items:center;font-size:30px;color:var(--gold);
    box-shadow:0 0 30px rgba(212,175,55,.5) inset,0 0 24px rgba(212,175,55,.35);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.06);opacity:1;}}
  .cover h1{
    font-size:clamp(30px,7vw,58px);letter-spacing:12px;
    background:linear-gradient(180deg,#fff6d8,var(--gold-light),var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(212,175,55,.35);
    margin-bottom:14px;
  }
  .cover p{font-size:14px;letter-spacing:4px;color:#9c9070;margin-bottom:38px;}
  .cover .hint{margin-top:22px;font-size:12px;letter-spacing:2px;color:#6f6650;}

  /* ========== 宝箱（游戏级豪华宝箱：透明 PNG 素材 + 开箱切换） ========== */
  .chest-wrap{
    position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
    z-index:12;width:min(340px,60vw,40vh);
    opacity:0;transition:opacity .9s;pointer-events:none;
  }
  .chest-wrap.show{opacity:1;}
  /* 宝箱后方柔和暖光，增强嵌入感 */
  .chest-wrap::before{
    content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:126%;height:118%;border-radius:50%;
    background:radial-gradient(circle,rgba(220,194,126,.17),rgba(220,194,126,0) 62%);
    filter:blur(14px);pointer-events:none;
  }
  /* 开箱时从箱内涌出的金光 */
  .chest-glow{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:0;height:0;border-radius:50%;
    background:radial-gradient(circle,#fdf8e8,#ddc583 22%,rgba(220,194,126,0) 64%);
    opacity:0;transition:width 1.2s ease, height 1.2s ease, opacity 1.2s ease;
    pointer-events:none;
  }
  .chest-wrap.open .chest-glow{width:min(980px,158vw);height:min(980px,158vw);opacity:1;}
  /* 透明素材：黑底已抠除，无需遮罩，直接贴合背景；投影只作用于箱体 */
  .chest-img{position:relative;width:100%;aspect-ratio:1526/1300;}
  .chest-img img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;
    filter:drop-shadow(0 16px 24px rgba(0,0,0,.6));
    transition:opacity .45s ease;
  }
  #chestOpen{opacity:0;}
  .chest-wrap.open #chestClosed{opacity:0;}
  .chest-wrap.open #chestOpen{opacity:1;}
  /* 开箱瞬间轻微弹动 */
  .chest-wrap.open .chest-img{animation:chestPop .75s cubic-bezier(.3,1.4,.5,1);}
  @keyframes chestPop{0%{transform:scale(.97);}55%{transform:scale(1.045);}100%{transform:scale(1);}}

  /* ========== 胜利界面（典雅鎏金：细画框 + 香槟金 + 微光流动） ========== */
  .victory{
    position:fixed;inset:0;z-index:35;display:grid;place-items:center;
    background:
      radial-gradient(ellipse at 50% 34%, rgba(176,141,74,.20), transparent 58%),
      radial-gradient(ellipse at 50% 50%, rgba(9,7,4,.96), rgba(2,2,1,.995) 74%);
    opacity:0;visibility:hidden;transition:opacity 1.1s, visibility 1.1s;
  }
  /* 胜利结算时彻底隐藏日志，避免文字重影 */
  body.won .log{opacity:0;visibility:hidden;transition:opacity .5s, visibility .5s;}
  .victory.show{opacity:1;visibility:visible;}

  /* 上方柔和光柱（营造“圣光洒落”的庄重感） */
  .v-beam{
    position:absolute;left:50%;top:-3%;transform:translateX(-50%);
    width:min(640px,86vw);height:66vh;pointer-events:none;
    background:linear-gradient(180deg, rgba(246,237,210,.11), rgba(246,237,210,0) 74%);
    -webkit-mask-image:radial-gradient(ellipse 46% 100% at 50% 0, #000, transparent 74%);
            mask-image:radial-gradient(ellipse 46% 100% at 50% 0, #000, transparent 74%);
    opacity:0;transition:opacity 1.9s .2s;
  }
  .victory.show .v-beam{opacity:1;}

  /* 全屏细双线画框（营造典雅的装裱感） */
  .v-frame{
    position:absolute;inset:22px;border:1px solid rgba(220,194,126,.28);
    opacity:0;transition:opacity 1.4s .15s;pointer-events:none;
  }
  .v-frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(176,141,74,.14);}
  .victory.show .v-frame{opacity:1;}
  /* 四角描金角花（L 形细线 + 小菱形点） */
  .v-frame .vc{position:absolute;width:42px;height:42px;opacity:.72;}
  .v-frame .vc.tl{top:0;left:0;border-top:1px solid var(--g2);border-left:1px solid var(--g2);}
  .v-frame .vc.tr{top:0;right:0;border-top:1px solid var(--g2);border-right:1px solid var(--g2);}
  .v-frame .vc.bl{bottom:0;left:0;border-bottom:1px solid var(--g2);border-left:1px solid var(--g2);}
  .v-frame .vc.br{bottom:0;right:0;border-bottom:1px solid var(--g2);border-right:1px solid var(--g2);}
  .v-frame .vc::after{content:"";position:absolute;width:5px;height:5px;background:var(--g2);transform:rotate(45deg);}
  .v-frame .vc.tl::after{top:3px;left:3px;}
  .v-frame .vc.tr::after{top:3px;right:3px;}
  .v-frame .vc.bl::after{bottom:3px;left:3px;}
  .v-frame .vc.br::after{bottom:3px;right:3px;}

  /* 内容区（逐项浮入） */
  .v-content{position:relative;z-index:2;text-align:center;padding:0 26px;}
  .v-content > *{opacity:0;}

  .v-emblem{width:min(260px,62vw);margin:0 auto 22px;}
  .v-emblem svg{display:block;width:100%;height:auto;}
  .v-kicker{font-size:11px;letter-spacing:.72em;text-indent:.72em;color:var(--g2);opacity:.85;margin-bottom:14px;}
  .v-title{font-size:clamp(40px,8.6vw,72px);letter-spacing:.2em;text-indent:.2em;font-weight:600;line-height:1.12;}
  .v-title span{
    background:linear-gradient(100deg,var(--g3) 0%, var(--g1) 24%, #fffaef 34%, var(--g1) 46%, var(--g3) 68%, var(--g2) 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.5)) drop-shadow(0 0 20px rgba(220,194,126,.2));
    animation:sheen 7.5s ease-in-out infinite;
  }
  @keyframes sheen{0%{background-position:135% 0;}100%{background-position:-35% 0;}}
  .v-rule{display:flex;align-items:center;justify-content:center;gap:16px;margin:26px auto 22px;}
  .v-rule span{height:1px;width:min(120px,22vw);
    background:linear-gradient(90deg,transparent,var(--g3),transparent);}
  .v-rule i{font-style:normal;font-size:10px;color:var(--g2);}
  .v-sub{font-size:13px;letter-spacing:.52em;text-indent:.52em;color:var(--g1);opacity:.92;}
  .v-desc{margin:22px auto 0;max-width:440px;font-size:13px;letter-spacing:.14em;line-height:2.1;color:#a89a85;}
  .v-stats{
    display:flex;justify-content:center;gap:clamp(34px,9vw,72px);
    width:min(430px,82vw);margin:34px auto 0;padding-top:24px;
    border-top:1px solid rgba(176,141,74,.16);
  }
  .v-stats > div{text-align:center;}
  .v-stats b{display:block;font-size:22px;letter-spacing:.06em;font-weight:600;color:var(--g1);}
  .v-stats span{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.28em;color:#857a63;}
  /* 结算按钮：克制的描金线条按钮 */
  .btn-line{
    margin-top:36px;cursor:pointer;font-family:inherit;
    padding:13px 44px;font-size:13px;letter-spacing:.44em;text-indent:.44em;
    color:var(--g1);background:transparent;border:1px solid rgba(220,194,126,.5);border-radius:1px;
    transition:.28s;
  }
  .btn-line:hover{background:rgba(220,194,126,.08);border-color:var(--g2);box-shadow:0 0 26px rgba(220,194,126,.16);}
  .btn-line:active{transform:translateY(1px);}

  /* 逐项浮入动画 */
  @keyframes vrise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .victory.show .v-content > *{animation:vrise .95s cubic-bezier(.22,1,.36,1) forwards;}
  .victory.show .v-content > *:nth-child(1){animation-delay:.15s;}
  .victory.show .v-content > *:nth-child(2){animation-delay:.28s;}
  .victory.show .v-content > *:nth-child(3){animation-delay:.4s;}
  .victory.show .v-content > *:nth-child(4){animation-delay:.55s;}
  .victory.show .v-content > *:nth-child(5){animation-delay:.66s;}
  .victory.show .v-content > *:nth-child(6){animation-delay:.76s;}
  .victory.show .v-content > *:nth-child(7){animation-delay:.9s;}
  .victory.show .v-content > *:nth-child(8){animation-delay:1.02s;}

  /* ========== 失败界面：被守卫擒住（阴森·血光） ========== */
  .capture{
    position:fixed;inset:0;z-index:34;overflow:hidden;display:grid;place-items:center;text-align:center;
    opacity:0;visibility:hidden;transition:opacity .5s, visibility .5s;
  }
  .capture.show{opacity:1;visibility:visible;}
  .cap-bg{
    position:absolute;inset:0;
    background:url("assets/scene-capture.jpg") center/cover no-repeat;
    transform:scale(1.14);
    filter:brightness(.52) saturate(.82) contrast(1.12);
  }
  .cap-veil{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 46%, rgba(0,0,0,.2), rgba(46,2,2,.72) 78%),
      linear-gradient(180deg, rgba(80,4,4,.42), rgba(4,0,0,.82));
    animation:beat 2.6s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{opacity:.82;}50%{opacity:1;}}
  .cap-inner{position:relative;z-index:2;padding:0 24px;}
  .cap-tag{
    font-size:12px;letter-spacing:.6em;text-indent:.6em;color:#e35b4a;margin-bottom:18px;
    text-shadow:0 0 18px rgba(200,40,30,.85);
  }
  .capture h3{
    font-size:clamp(30px,7vw,58px);letter-spacing:.16em;font-weight:600;color:#f1e2d2;
    text-shadow:0 0 34px rgba(150,20,10,.9), 0 2px 6px #000;
  }
  .capture p{margin-top:18px;font-size:14px;letter-spacing:.16em;color:#c9b7ab;max-width:560px;}
  /* 血光按钮 */
  .btn-danger{
    margin-top:36px;cursor:pointer;font-family:inherit;
    padding:12px 34px;font-size:15px;letter-spacing:.4em;text-indent:.4em;font-weight:600;
    color:#ffdcd2;background:linear-gradient(180deg, rgba(122,20,14,.85), rgba(58,8,6,.9));
    border:1px solid rgba(214,72,52,.7);border-radius:3px;
    box-shadow:0 0 26px rgba(150,20,10,.35) inset, 0 0 20px rgba(150,20,10,.3);
    transition:.2s;
  }
  .btn-danger:hover{background:linear-gradient(180deg, rgba(164,32,20,.95), rgba(84,12,8,.95));box-shadow:0 0 34px rgba(214,50,30,.55);}
  .btn-danger:active{transform:translateY(1px);}

  /* 危险氛围（守卫阶段浮现的暗红暗角，增添惊悚感） */
  .danger-veil{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s;
    background:radial-gradient(circle at 50% 50%, transparent 34%, rgba(120,10,6,.55) 100%);
  }
  .danger-veil.show{opacity:1;animation:beat 3.4s ease-in-out infinite;}

  /* 金色粒子画布 */
  #fx{position:fixed;inset:0;z-index:13;pointer-events:none;}

  /* 受击/震动反馈 */
  @keyframes shake{
    10%,90%{transform:translate(-2px,0);}
    30%,70%{transform:translate(4px,0);}
    50%{transform:translate(-4px,0);}
  }
  .shaking{animation:shake .45s;}
  /* 闪光反馈（金 / 血光） */
  .flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle,#fff8dc,#f5d76e);opacity:0;}
  .flash.red{background:radial-gradient(circle,#ff5238,#6e0b04);}
  @keyframes flashAnim{0%{opacity:.9;}100%{opacity:0;}}
</style>
</head>
<body>

<!-- 开场封面 -->
<div class="cover" id="cover">
  <div>
    <div class="seal">⛩</div>
    <h1>幽刹寻宝</h1>
    <p>深 山 古 刹 · 秘 藏 之 旅</p>
    <button class="btn" id="startBtn">开 始 探 险</button>
    <div class="hint">按下按钮，踏入被青苔吞没的古老幽刹</div>
  </div>
</div>

<!-- 场景背景层 -->
<div id="scenes"></div>

<div class="danger-veil" id="dangerVeil"></div>

   · 页面实时输出旁白、章节进度与动画反馈
   ========================================================= */

let runStart=0, guardAttempts=0;

/* ---------------- 音乐与音效 ----------------
   背景音乐：Pixabay《Most Fear (Horror)》（Pixabay 内容许可，可商用）
             的 38 秒无缝循环选段：低频暗色铺底 + 间隔出现的稀疏惊悚音，
             没有旋律和节拍，不会被听成“度假音乐”。
             只在探索、守卫、开箱时播放；被擒与胜利时暂停，交给合成音效。
   音效：Web Audio 实时合成，不依赖任何外部音频文件。                 */
const BGM_VOL=0.8;
let bgmWanted=true, audioCtx=null, bgmStarted=false;
let masterGain=null, sfxGain=null, reverb=null;
let bgmAudio=null, ghostBuffer=null;      // ghostBuffer：内嵌的鬼语音频，启动时解码

/* 用衰减噪声做卷积混响，模拟古庙石壁的回声 */
function makeImpulse(sec, decay){
  const rate=audioCtx.sampleRate, len=Math.floor(rate*sec);
  const buf=audioCtx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){
      d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
  }
  return buf;
}

/* 单个音符：指数起音与衰减，听起来像拨弦 / 钟片 */
function tone(freq, when, dur, peak, type="sine", dest=null){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator();
  o.type=type; o.frequency.value=freq;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), when+Math.min(0.22,dur*0.18));
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.connect(g); g.connect(dest||sfxGain);
  o.start(when); o.stop(when+dur+0.05);
}

/* 噪声爆发（气声 / 低吼），用于被擒与守卫登场 */
function noiseBurst(when, dur, peak, cutoff){
  if(!audioCtx) return;
  const len=Math.floor(audioCtx.sampleRate*dur);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=audioCtx.createBufferSource(); s.buffer=buf;
  const f=audioCtx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(peak, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  s.connect(f); f.connect(g); g.connect(sfxGain);
  s.start(when); s.stop(when+dur);
}

/* 金币：一组非谐波泛音 + 极快衰减，就是“叮”的一声 */
function sfxCoin(when, freq, peak){
  [1, 2.76, 5.40, 8.93].forEach((m,i)=>{
    tone(freq*m, when, 0.55/(1+i*0.55), peak/(i+1), "sine", sfxGain);
  });
}
function coinShower(count=16, spread=0.9, peak=0.05){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  for(let i=0;i<count;i++){
    sfxCoin(t0+Math.random()*spread,
            1700+Math.random()*2300,
            peak*(0.6+Math.random()*0.6));
  }
}

/* 鬼语：播放内嵌的低沉人声「抓到你了……把宝物留下……」。
   音频已做降调、失真与石壁回声处理，像从墙里挤出来的低语，而不是尖叫 */
function playGhostVoice(when){
  if(!ghostBuffer) return;
  const s=audioCtx.createBufferSource();
  s.buffer=ghostBuffer;
  s.playbackRate.value=0.97;            // 再压低一点，更沉
  const g=audioCtx.createGain(); g.gain.value=1.0;
  s.connect(g); g.connect(sfxGain);
  if(when) s.start(when); else s.start();
}

/* 被守卫擒住：低频下坠轰鸣 + 不协和音簇 + 鬼语低诉 */
function sfxCapture(){
  if(!audioCtx) return;
  if(audioCtx.state==="suspended") audioCtx.resume();
  const t0=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(84,t0);
  o.frequency.exponentialRampToValueAtTime(30,t0+0.9);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.11,t0+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+1.1);
  o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0+1.2);

  playGhostVoice(t0+0.16);                // 鬼在耳边开口说话
  [110,116.54,155.56,233.08].forEach((f,i)=>{
    tone(f, t0+0.02, 1.1, 0.028/(i*0.45+1), "triangle", sfxGain);
  });
  noiseBurst(t0, 0.8, 0.045, 900);
}

/* 守卫登场：远处石门与低鸣 */
function sfxGuard(){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  noiseBurst(t0, 1.6, 0.07, 240);
  tone(55, t0, 2.2, 0.06, "sine", sfxGain);
}

/* 开箱：向上的“金光”滑音 + 金币倾泻 */
function sfxOpen(){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  const o=audioCtx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(180,t0);
  o.frequency.exponentialRampToValueAtTime(1500,t0+1.1);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.07,t0+0.35);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+1.3);
  o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0+1.4);
  coinShower(12, 1.0, 0.045);
}

/* 胜利：明亮的上行琶音 + 大量金币 */
function sfxVictory(){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  [587.33, 739.99, 880.00, 1174.66].forEach((f,i)=>{
    tone(f, t0+i*0.13, 1.8, 0.07, "triangle", sfxGain);
    tone(f*2, t0+i*0.13, 1.1, 0.022, "sine", sfxGain);
  });
  coinShower(22, 1.3, 0.05);
}

/* 背景音乐：被擒与胜利时暂停，让音效单独说话 */
function musicPause(){ if(bgmAudio) bgmAudio.pause(); }
function musicResume(){
  if(bgmAudio && bgmWanted) bgmAudio.play().catch(()=>{});
}

function startBgm(){
  if(bgmStarted){
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    return;
  }
  bgmStarted = true;

  /* 1) 背景音乐：音频以 base64 内嵌在 <script id="bgmData"> 里，
        没有任何文件请求，所以预览环境和本地打开都能正常播放 */
  const holder = document.getElementById("bgmData");
  if(holder){
    const b64 = holder.textContent.replace(/\s+/g,"");
    if(b64){
      bgmAudio = new Audio("data:audio/mpeg;base64,"+b64);
      bgmAudio.loop = true;
      bgmAudio.volume = 0;
      bgmAudio.play().catch(()=>{});      // 已由用户的点击解锁播放权限
      /* 2.4 秒淡入，避免一上来就砸耳朵 */
      const t0 = performance.now();
      const step = ()=>{
        if(!bgmAudio) return;
        const k = Math.min(1,(performance.now()-t0)/2400);
        if(bgmWanted) bgmAudio.volume = BGM_VOL * k;
        if(k<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  }

  /* 2) 音效引擎：被擒、开箱、金币、胜利的琶音都由它实时合成 */
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;                          // 环境不支持则只保留背景乐
  audioCtx = new AC();
  if(audioCtx.state==="suspended") audioCtx.resume();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.9;
  masterGain.connect(audioCtx.destination);

  reverb = audioCtx.createConvolver();
  reverb.buffer = makeImpulse(2.6, 2.4);
  const wet = audioCtx.createGain(); wet.gain.value = 0.34;
  reverb.connect(wet); wet.connect(masterGain);

  sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.9;
  sfxGain.connect(masterGain); sfxGain.connect(reverb);

  /* 3) 鬼语：启动时就解码内嵌的人声，被擒时才能立刻开口 */
  const ghostHolder = document.getElementById("ghostData");
  if(ghostHolder){
    const b64 = ghostHolder.textContent.replace(/\s+/g,"");
    if(b64){
      try{
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
        audioCtx.decodeAudioData(bytes.buffer)
          .then(buf=>{ ghostBuffer=buf; })
          .catch(()=>{});
      }catch(e){ /* 解码失败则静默跳过 */ }
    }
  }
}
soundBtn.onclick=()=>{
  bgmWanted=!bgmWanted;
  soundBtn.classList.toggle("off", !bgmWanted);
  soundBtn.setAttribute("aria-pressed", bgmWanted?"true":"false");
  if(bgmAudio){
    bgmAudio.volume = bgmWanted ? BGM_VOL : 0;
    if(bgmWanted) bgmAudio.play().catch(()=>{}); else bgmAudio.pause();
  }
  if(!masterGain) return;                 // 音效引擎还没启动时只切换图标状态
  if(audioCtx.state==="suspended") audioCtx.resume();
  masterGain.gain.setTargetAtTime(bgmWanted?0.9:0, audioCtx.currentTime, 0.25);
};

/* ---------------- 4. 核心：Promise 封装每个寻宝阶段 ----------------
   对应实验参考代码 TreasureMap 的异步流程                              */
class TreasureMap{

  /* ① 在图书馆里找到第一个线索 */
  static findClue(){
    return new Promise(resolve=>{
      setTimeout(()=>{
        resolve("在昏暗的古籍图书馆里，你从积尘的书架上找到了第一个线索。");
      }, 2000);
    });
  }

  /* ② 破解藏宝图上的古老密码 */
  static decryptScript(clue){
    return new Promise(resolve=>{
      setTimeout(()=>{
        resolve("你对照烛光解开了古卷上的密码，指向了一座隐藏在群山深处的古老幽刹。");
      }, 2000);
    });
  }

  /* ③ 前往古庙 */
  static searchTemple(location){
    return new Promise(resolve=>{
      setTimeout(()=>{
        resolve("穿过藤蔓与雾霭，你终于抵达了那座被青苔吞没的古老幽刹。");
      }, 2200);
    });
  }

  /* ④ 遭遇石像守卫（随机判定成功 / 失败） */
  static meetGuard(){
    return new Promise((resolve,reject)=>{
      setTimeout(()=>{
        const chance=Math.random();
        if(chance>0.35){
          resolve("石像守卫认出了你手中的古老信物，缓缓让开通往宝箱的路。");
        }else{
          reject(new Error("石像守卫忽然动了，冰冷的手一把将你擒住——你被拖出了庙门。"));
        }
      }, 2000);
    });
  }

  /* ⑤ 打开宝箱 */
  static openTreasureBox(){
    return new Promise(resolve=>{
      setTimeout(()=>{
        resolve("尘封千年的宝箱缓缓开启，耀眼金光喷涌而出，照亮了整座神庙！");
      }, 2400);
    });
  }
}

/* ⑥ 完整的寻宝流程（用 async/await 串联 + try/catch 兜底） */
async function findTreasureWithPromise(){
  logEl.innerHTML="";            // 清空日志
  document.body.classList.remove("won");
  captureEl.classList.remove("show");
  dangerVeilEl.classList.remove("show");
  chestWrap.classList.remove("show");
  chestWrap.classList.remove("open");
  victoryEl.classList.remove("show");

  try{
    /* 章节 1：寻找线索 */
    setChapter(0); switchScene("library"); setStatus("探索中");
    musicResume();                      // 探险开始，背景乐淡入后持续播放
    await typeLine("你点燃火折子，走进了昏暗的古籍图书馆……","action");
    const clue = await TreasureMap.findClue();
    await typeLine(clue,"result");

    /* 章节 2：破解密码 */
    setChapter(1); setStatus("解密中");
    await typeLine("你摊开古卷，开始对照密文推演……","action");
    const location = await TreasureMap.decryptScript(clue);
    await typeLine(location,"result");

    /* 章节 3：前往神庙 */
    setChapter(2); switchScene("temple"); setStatus("跋涉中");
    await typeLine("循着密码的指引，你向群山深处进发……","action");
    const entered = await TreasureMap.searchTemple(location);
    await typeLine(entered,"result");

    /* 章节 4：石像守卫（可重试直到通过） */
    setChapter(3); switchScene("guard");
    dangerVeilEl.classList.add("show");   // 浮现暗红危险氛围
    sfxGuard();                           // 石门与低鸣
    let passed=false;
    while(!passed){
      setStatus("危险","danger");
      await typeLine("石门缓缓合拢，两旁的石像守卫同时转过了头……","action");
      try{
        const guardMsg = await TreasureMap.meetGuard();
        await typeLine(guardMsg,"success");
        setStatus("已通过");
        passed=true;
      }catch(err){
        guardAttempts++;
        await typeLine(err.message,"fail");
        await wait(450);
        captureEl.classList.add("show");  // 显示「被守卫擒住」失败画面
        shake();
        redFlash();
        musicPause();                     // 暂停背景乐，只留被擒的轰鸣
        sfxCapture();                     // 被擒音效：下坠轰鸣 + 不协和音簇
        await waitForRetry();             // 等待玩家点击「再潜入一次」
        captureEl.classList.remove("show");
        musicResume();                    // 重新潜入，背景乐接回
      }
    }
    dangerVeilEl.classList.remove("show");

    /* 章节 5：开启宝箱 */
    setChapter(4); switchScene("treasure"); setStatus("开启宝箱");
    chestWrap.classList.add("show");
    await typeLine("你走向神庙深处的祭坛，那里静静矗立着一只鎏金宝箱……","action");
    await typeLine("你伸出手，触碰了箱盖。","action");
    const boxMsg = await TreasureMap.openTreasureBox();
    chestWrap.classList.add("open");    // 切换为开启状态：掀盖 + 涌出金光
    flash();                            // 屏幕金光闪烁
    sfxOpen();                          // 上升的金光滑音 + 金币倾泻
    await typeLine(boxMsg,"success");

    /* 章节 6：取得宝物 · 胜利 */
    setChapter(5); setStatus("寻宝成功","success");
    musicPause();                         // 胜利时停掉背景乐，只留庆祝音效
    sfxVictory();                         // 上行琶音 + 大量金币声
    startGoldParticles();
    victoryDescEl.textContent =
      "你捧起了传说中的宝物，千年的守候终得圆满。恭喜你，寻宝者。";
    const secs = Math.max(1, Math.round((Date.now()-runStart)/1000));
    statTimeEl.textContent = secs + " 秒";
    statGuardEl.textContent = guardAttempts===0 ? "一次通过" : guardAttempts+" 次被拦";
    document.body.classList.add("won");
    victoryEl.classList.add("show");

  }catch(err){
    /* 兜底：整个流程出现意外错误 */
    await typeLine("远征中发生了意外："+err.message,"fail");
    console.error("寻宝任务失败：",err);
  }
}

/* 被守卫擒住后，等待玩家点击「再潜入一次」 */
function waitForRetry(){
  return new Promise(resolve=>{
    retryBtn.onclick=()=>{ retryBtn.onclick=null; resolve(); };
  });
}

/* ---------------- 5. 金色粒子特效用画布 ---------------- */
const canvas=$("fx"), ctx=canvas.getContext("2d");
let particles=[], rafId=null, running=false;
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
addEventListener("resize",resize); resize();

function startGoldParticles(){
  if(running) return;
  running=true; particles=[];
  for(let i=0;i<160;i++) particles.push(newParticle(true));
  loop();
}
function newParticle(spread){
  return{
    x:Math.random()*canvas.width,
    y:spread? Math.random()*canvas.height : canvas.height+10,
    r:Math.random()*2.6+0.8,
    vy:-(Math.random()*1.6+0.6),
    vx:(Math.random()-0.5)*0.7,
    a:Math.random()*0.6+0.4,
    hue:Math.random()*14+40
  };
}
function loop(){
  if(!running) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.a-=0.0025;
    if(p.y<-10||p.a<=0){ Object.assign(p,newParticle(false)); }
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
    g.addColorStop(0,`hsla(${p.hue},72%,80%,${p.a})`);
    g.addColorStop(1,"hsla(44,72%,66%,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2); ctx.fill();
  });
  rafId=requestAnimationFrame(loop);
}
function stopGoldParticles(){ running=false; if(rafId)cancelAnimationFrame(rafId); ctx.clearRect(0,0,canvas.width,canvas.height); }

/* ---------------- 6. 启动与重置 ---------------- */
function beginGame(){
  coverEl.classList.add("hide");
  hudEl.style.opacity=1; progressEl.style.opacity=1;
  runStart=Date.now(); guardAttempts=0;   // 重置统计
  startBgm();                            // 由点击触发，符合浏览器播放策略
  findTreasureWithPromise();
}
$("startBtn").onclick=beginGame;
againBtn.onclick=()=>{
  victoryEl.classList.remove("show");
  stopGoldParticles();
  beginGame();
};
</script>
